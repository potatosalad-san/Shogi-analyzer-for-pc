<header><button class="ib" id="bk" style="display:none">←</button><h1 id="ttl">棋譜管理</h1><button class="ib" id="cs" style="font-size:13px;width:auto;padding:0 8px">☁</button><button class="ib" id="mn">⋮</button></header>

<script>
const $=s=>document.querySelector(s),P={歩:'と',香:'杏',桂:'圭',銀:'全',角:'馬',飛:'龍'},U={};for(const k in P)U[P[k]]=k;
const LN={と:'と',杏:'成香',圭:'成桂',全:'成銀',馬:'馬',龍:'龍'},RK='一二三四五六七八九',HO='飛角金銀桂香歩';
let G=[],g=null,cur=null,sel=null,view='home',flip=false,open=null,tab=1;
try{G=JSON.parse(localStorage.getItem('kifu')||'[]')}catch(e){}
const rep=(k,v)=>k==='st'||k==='par'||k==='_o'||k==='_tm'?undefined:v;
let cdb=null,cuid=null;
function persist(){try{localStorage.setItem('kifu',JSON.stringify(G,rep))}catch(e){}}
function save(){if(g){g.t=Date.now();cloudSave(g)}persist()}
const ck=id=>id.replace(/[^\w-]/g,'_'),cref=o=>cdb.doc('users/'+cuid+'/kifu/'+ck(o.id));
function setSt(s){const b=$('#cs');if(!b)return;b.dataset.s=s;b.textContent={off:'ログイン',sync:'⟳',ok:'☁✓',err:'⚠'}[s];b.style.fontSize=s==='off'?'13px':'18px'}
function cloudSave(o){if(!cdb)return;clearTimeout(o._tm);setSt('sync');o._tm=setTimeout(()=>push(o),800)}
function push(o){const j=JSON.stringify(o.root,rep);if(new Blob([j]).size>950000){setSt('err');toast('クラウド保存の上限（約1MB）を超えました');return Promise.resolve()}
return cref(o).set({gid:o.id,title:o.title,t:o.t,json:j}).then(()=>setSt('ok'),()=>setSt('err'))}
function tomb(o){if(cdb)cref(o).set({gid:o.id,del:true,t:Date.now()}).catch(()=>{})}
async function sync(){if(!cdb)return;try{setSt('sync');
const snap=await cdb.collection('users/'+cuid+'/kifu').get(),cl={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.gid)cl[x.gid]=x});
for(const k in cl){const x=cl[k],l=G.find(o=>o.id===k);if(x.del){if(l&&l!==g&&l.t<=x.t)G=G.filter(o=>o!==l);continue}
if(!l)G.push({id:k,title:x.title,t:x.t,root:JSON.parse(x.json)});else if(x.t>l.t&&l!==g){l.title=x.title;l.t=x.t;l.root=JSON.parse(x.json)}}
for(const o of G){const x=cl[o.id];if(!x||o.t>x.t)await push(o)}
persist();setSt('ok');if(view==='home')render()}catch(e){console.error(e);setSt('err')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}
function init(){const b=[];for(let y=0;y<=9;y++)b.push(Array(10).fill(null));const k='香桂銀金玉金銀桂香';
for(let x=1;x<=9;x++){b[1][x]={p:k[x-1],s:1};b[9][x]={p:k[x-1],s:0};b[3][x]={p:'歩',s:1};b[7][x]={p:'歩',s:0}}
b[2][8]={p:'飛',s:1};b[2][2]={p:'角',s:1};b[8][2]={p:'飛',s:0};b[8][8]={p:'角',s:0};return{b,h:[{},{}],side:0,last:null}}
function apply(st,m){const b=st.b.map(r=>r.slice()),h=[{...st.h[0]},{...st.h[1]}],s=st.side;
if(m.drop){h[s][m.drop]--;b[m.ty][m.tx]={p:m.drop,s}}else{const pc=b[m.fy][m.fx],cap=b[m.ty][m.tx];b[m.fy][m.fx]=null;
if(cap){const bs=U[cap.p]||cap.p;if(bs!=='玉')h[s][bs]=(h[s][bs]||0)+1}b[m.ty][m.tx]={p:m.pro?P[pc.p]:pc.p,s}}
return{b,h,side:1-s,last:[m.tx,m.ty]}}
function label(st,m){const mk=st.side?'△':'▲',same=st.last&&st.last[0]==m.tx&&st.last[1]==m.ty,pos=same?'同　':m.tx+RK[m.ty-1];
if(m.drop)return mk+pos+m.drop+'打';const pc=st.b[m.fy][m.fx].p;return mk+pos+(LN[pc]||pc)+(m.pro?'成':'')+'('+m.fx+m.fy+')'}
function getSt(n){if(!n.st)n.st=apply(getSt(n.par),n.m);return n.st}
function relink(n,p){n.par=p;n.ch.forEach(c=>relink(c,n))}
function mkGame(t,root){const o={id:Date.now()+''+Math.random(),title:t,t:Date.now(),root:root||{ch:[],c:''}};G.unshift(o);return o}
function openGame(o){g=o;relink(g.root,null);g.root.st=init();cur=g.root;sel=null;open=null;show('game')}
function addMove(m){const st=getSt(cur),lab=label(st,m);let e=cur.ch.find(c=>c.lab===lab);
if(!e){e={m,lab,c:'',ch:[],par:cur};cur.ch.push(e)}cur=e;sel=null;open=null;save();render()}
const FW='０１２３４５６７８９';
function parseKif(tx){const root={ch:[],c:''};root.st=init();let n=root,path=[],lines=[path];
for(const raw of tx.split(/\r?\n/)){const l=raw.trim();
const vm=l.match(/^変化[：:]\s*(\d+)/);if(vm){const N=+vm[1];let src=[];for(const q of lines)if(q.length>=N-1)src=q;path=src.slice(0,N-1);lines.push(path);n=path.length?path[path.length-1]:root;continue}
if(l[0]==='*'){n.c=(n.c?n.c+'\n':'')+l.slice(1).trim();continue}
const r=l.replace(/[０-９]/g,c=>FW.indexOf(c)).match(/^(\d+)\s+(同\s*|[1-9][一二三四五六七八九1-9])(成香|成桂|成銀|[歩香桂銀金角飛玉王と馬龍竜])(成)?(打|\((\d)(\d)\))?/);
if(!r)continue;const st=getSt(n);let tx_,ty;
if(r[2][0]==='同'){if(!st.last)continue;[tx_,ty]=st.last}else{tx_=+r[2][0];ty=isNaN(r[2][1])?RK.indexOf(r[2][1])+1:+r[2][1]}
const nm={成香:'杏',成桂:'圭',成銀:'全',竜:'龍',王:'玉'}[r[3]]||r[3];let m;
if(r[5]==='打')m={drop:nm,tx:tx_,ty};else if(r[6])m={fx:+r[6],fy:+r[7],tx:tx_,ty,pro:!!r[4]};else continue;
if(!m.drop&&!(st.b[m.fy]&&st.b[m.fy][m.fx]))break;
